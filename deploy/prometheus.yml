global: {scrape_interval: 5s}
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: verifier
    static_configs: [{targets: ["verifier:8100"]}]
  - job_name: llm-stub
    metrics_path: /metrics
    static_configs: [{targets: ["llm-stub:9000"]}]
  - job_name: worker                       # DNS service discovery: every scaled replica is scraped
    dns_sd_configs: [{names: ["worker"], type: A, port: 9100}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
